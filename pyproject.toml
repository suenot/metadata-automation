[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metadata-automation"
version = "0.2.0"
description = "Deterministic editorial metadata drafts for video publishers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23,<5"]

[project.scripts]
metadata-automation = "metadata_automation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
metadata_automation = ["schemas/*.json"]
